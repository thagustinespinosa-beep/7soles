<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Creador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-bg">

    <header class="admin-header">
        <h1>⚙️ Panel del Creador (Administración)</h1>
        <div style="display: flex; gap: 16px; align-items: center;">
            <a href="/" style="color: white; font-weight: bold;">Ver tienda pública</a>
            <form action="/admin/logout" method="post" style="margin: 0;">
                <button type="submit" class="btn-guardar">Cerrar sesión</button>
            </form>
        </div>
    </header>

    <div class="container main-admin">
        
        <!-- ESTADO DEL DELIVERY -->
        <section class="card admin-card">
            <h2>🚚 Estado del Delivery</h2>
            <label class="switch-container">
                <input type="checkbox" id="delivery-toggle" onchange="cambiarEstadoDelivery(this.checked)" 
                {% if configuracion and configuracion.delivery_disponible %} checked {% endif %}>
                <span>Habilitar Delivery para los clientes</span>
                <span id="delivery-estado" role="status">{{ 'Habilitado' if configuracion.delivery_disponible else 'Deshabilitado' }}</span>
            </label>
        </section>

        <!-- SECCIÓN DE PEDIDOS POR ESTADO -->
        <section class="card admin-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>📥 Gestión de Pedidos</h2>
                <button class="btn-guardar" onclick="cargarPedidos()" style="width: auto; padding: 5px 15px;">🔄 Actualizar Pedidos</button>
            </div>

            <!-- Filtro de Estados -->
            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px;">
                <button onclick="filtrarPedidos('Pendiente')" style="padding: 8px 15px; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; background-color: #e67e22; color: white;">⏳ Pendientes (<span id="cant-pendiente">0</span>)</button>
                <button onclick="filtrarPedidos('Confirmado')" style="padding: 8px 15px; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; background-color: #27ae60; color: white;">✅ Confirmados / En proceso (<span id="cant-confirmado">0</span>)</button>
                <button onclick="filtrarPedidos('Finalizado')" style="padding: 8px 15px; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; background-color: #2980b9; color: white;">🏁 Finalizados (<span id="cant-finalizado">0</span>)</button>
                <button onclick="filtrarPedidos('Rechazado')" style="padding: 8px 15px; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; background-color: #c0392b; color: white;">❌ Rechazados (<span id="cant-rechazado">0</span>)</button>
            </div>

            <div id="lista-pedidos">
                <!-- Se cargan dinámicamente -->
            </div>
        </section>

        <!-- AGREGAR NUEVA BEBIDA -->
        <section class="card admin-card">
            <h2>➕ Agregar Nueva Bebida al Catálogo</h2>
            <form id="form-nueva-bebida" onsubmit="agregarNuevaBebida(event)" enctype="multipart/form-data" class="form-grid">
                <div>
                    <label>Nombre de la bebida:</label>
                    <input type="text" id="nuevo-nombre" required placeholder="Ej: Cerveza Quilmes 1L">
                </div>
                <div>
                    <label>Precio normal ($):</label>
                    <input type="number" min="0" step="0.01" id="nuevo-precio" required placeholder="Ej: 2500" oninput="actualizarPrecioNuevo()">
                </div>
                <div>
                    <label>Descuento del producto (%):</label>
                    <input type="number" min="0" max="99.99" step="0.01" id="nuevo-descuento" value="0" required oninput="actualizarPrecioNuevo()">
                </div>
                <div>
                    <label>Precio final ($):</label>
                    <input type="number" id="nuevo-precio-final" readonly>
                </div>
                <div>
                    <label>Stock inicial:</label>
                    <input type="number" min="0" step="1" id="nuevo-stock" required placeholder="Ej: 24">
                </div>
                <div>
                    <label>Imagen del producto:</label>
                    <input type="file" id="nuevo-imagen" accept="image/*">
                    <input type="url" id="nuevo-imagen-url" placeholder="https://ejemplo.com/imagen.jpg" aria-label="URL de imagen del producto">
                </div>
                <div style="grid-column: 1 / -1;">
                    <button type="submit" class="btn-guardar" style="margin-top: 10px;">Guardar Nueva Bebida</button>
                </div>
            </form>
        </section>

        <!-- GESTIÓN DE STOCK Y PRECIOS EXISTENTES -->
        <section class="card admin-card">
            <div style="display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap;">
                <h2>📦 Gestión de Stock y Precios</h2>
                <button type="button" class="btn-guardar" onclick="sincronizarCatalogoCsv()" style="width: auto;">Actualizar catálogo desde CSV</button>
            </div>
            <div style="overflow-x: auto;">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Producto</th>
                        <th>Precio normal ($)</th>
                        <th>Descuento (%)</th>
                        <th>Precio final ($)</th>
                        <th>Stock Actual</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="admin-productos-body">
                    <!-- Se carga dinámicamente -->
                </tbody>
            </table>
            </div>
        </section>

    </div>

    <script>
        let todosLosPedidos = [];
        let estadoFiltroActual = 'Pendiente';

        function formatoPrecio(valor) {
            return Number(valor || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function calcularPrecioFinal(precio, descuento) {
            return Math.round((Number(precio || 0) * (1 - Number(descuento || 0) / 100) + Number.EPSILON) * 100) / 100;
        }

        function escaparHtml(valor) {
            return String(valor || '').replace(/[&<>"']/g, caracter => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[caracter]));
        }

        function rutaImagen(imagen) {
            if (!imagen) return '/static/images/producto-sin-imagen.svg';
            if (/^https?:\/\//i.test(imagen) || imagen.startsWith('/')) return imagen;
            return `/static/uploads/${encodeURIComponent(imagen)}`;
        }

        function actualizarPrecioNuevo() {
            const precio = document.getElementById('nuevo-precio').value;
            const descuento = document.getElementById('nuevo-descuento').value;
            document.getElementById('nuevo-precio-final').value = calcularPrecioFinal(precio, descuento).toFixed(2);
        }

        function actualizarPrecioFinal(id) {
            const precio = document.getElementById(`precio-${id}`).value;
            const descuento = document.getElementById(`descuento-${id}`).value;
            document.getElementById(`precio-final-${id}`).value = calcularPrecioFinal(precio, descuento).toFixed(2);
        }

        async function cargarPedidos() {
            try {
                const res = await fetch('/api/admin/pedidos');
                todosLosPedidos = await res.json();
                
                // Actualizar contadores
                document.getElementById('cant-pendiente').innerText = todosLosPedidos.filter(p => p.estado === 'Pendiente').length;
                document.getElementById('cant-confirmado').innerText = todosLosPedidos.filter(p => p.estado === 'Confirmado').length;
                document.getElementById('cant-finalizado').innerText = todosLosPedidos.filter(p => p.estado === 'Finalizado').length;
                document.getElementById('cant-rechazado').innerText = todosLosPedidos.filter(p => p.estado === 'Rechazado').length;

                renderPedidos();
            } catch (err) {
                console.error("Error al cargar pedidos:", err);
            }
        }

        function filtrarPedidos(estado) {
            estadoFiltroActual = estado;
            renderPedidos();
        }

        function renderPedidos() {
            const contenedor = document.getElementById('lista-pedidos');
            contenedor.innerHTML = '';

            const filtrados = todosLosPedidos.filter(p => p.estado === estadoFiltroActual);

            if (filtrados.length === 0) {
                contenedor.innerHTML = `<p style="color: #777; padding: 10px;">No hay pedidos en la lista "${estadoFiltroActual}".</p>`;
                return;
            }

            filtrados.slice().reverse().forEach(p => {
                const div = document.createElement('div');
                div.style.border = '1px solid #ddd';
                div.style.padding = '15px';
                div.style.marginBottom = '12px';
                div.style.borderRadius = '8px';
                div.style.backgroundColor = p.estado === 'Confirmado' ? '#e8f8f5' : (p.estado === 'Rechazado' ? '#fadbd8' : (p.estado === 'Finalizado' ? '#f2f4f4' : '#fff8e7'));

                const listaItems = (p.items || []).map(i => `${i.nombre} (x${i.cantidad})`).join(', ');
                const subtotalProductos = Number(p.subtotal_productos ?? p.total ?? 0);
                const envioPendiente = p.entrega === 'delivery' && p.costo_envio == null;

                let acciones = '';
                if (p.entrega === 'delivery') {
                    acciones += `
                        <div style="margin-top: 12px; padding-top: 10px; border-top: 1px solid #ddd;">
                            <p><strong>Subtotal productos:</strong> $${formatoPrecio(subtotalProductos)}</p>
                            <p><strong>Envío:</strong> ${envioPendiente ? 'A confirmar por el vendedor' : `$${formatoPrecio(p.costo_envio)}`}</p>
                            <p><strong>Total ${envioPendiente ? 'provisorio' : 'final'}:</strong> $${formatoPrecio(p.total)}</p>
                            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px;">
                                <label for="costo-envio-${p.id}">Asignar / editar costo de envío ($)</label>
                                <input type="number" id="costo-envio-${p.id}" min="0" step="0.01" value="${p.costo_envio ?? ''}" placeholder="Monto según zona">
                                <button class="btn-guardar" type="button" onclick="guardarCostoEnvio(${p.id})" style="width: auto;">Guardar envío y notificar</button>
                            </div>
                        </div>
                    `;
                }
                if (p.estado === 'Pendiente') {
                    acciones += `
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <button class="btn-guardar" onclick="aceptarPedido(${p.id})" style="background-color: #27ae60;">
                                ✅ Aceptar Pedido y Notificar
                            </button>
                            <button class="btn-guardar" onclick="rechazarPedido(${p.id})" style="background-color: #c0392b;">
                                ❌ Rechazar Pedido
                            </button>
                        </div>
                    `;
                } else if (p.estado === 'Confirmado') {
                    acciones += `
                        <button class="btn-guardar" onclick="finalizarPedido(${p.id})" style="margin-top: 10px; background-color: #2980b9;">
                            🏁 Marcar como Terminado / Entregado
                        </button>
                    `;
                } else if (p.estado === 'Rechazado') {
                    acciones += `<p style="color: #c0392b; font-weight: bold; margin-top: 8px;">❌ Cancelado: ${p.motivo_rechazo || 'Sin motivo'}</p>`;
                } else {
                    acciones += `<p style="color: #27ae60; font-weight: bold; margin-top: 8px;">✔ Pedido Finalizado</p>`;
                }

                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 8px;">
                        <strong>Pedido #${p.id}</strong>
                        <span style="padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 13px; background: ${p.estado === 'Confirmado' ? '#27ae60' : (p.estado === 'Rechazado' ? '#c0392b' : (p.estado === 'Finalizado' ? '#2980b9' : '#e67e22'))}; color: white;">
                            ${p.estado}
                        </span>
                    </div>
                    <p>👤 <strong>Cliente:</strong> ${p.cliente} | 📞 <strong>Tel:</strong> ${p.telefono}</p>
                    <p>🚚 <strong>Entrega:</strong> ${(p.entrega || '').toUpperCase()} ${p.direccion ? `(${p.direccion})` : ''}</p>
                    <p>💳 <strong>Método de Pago:</strong> ${p.metodoPago}</p>
                    <p>🛒 <strong>Detalle:</strong> ${listaItems}</p>
                    ${p.entrega !== 'delivery' ? `<p style="font-size: 16px; margin-top: 5px;"><strong>Total: $${formatoPrecio(p.total)}</strong></p>` : ''}
                    ${acciones}
                `;
                contenedor.appendChild(div);
            });
        }

        async function aceptarPedido(id) {
            const res = await fetch('/api/admin/aceptar_pedido', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });

            const data = await res.json();

            if (res.ok) {
                alert("Pedido Aceptado correctamente.");
                if (data.telefono) {
                    window.open(`https://wa.me/${data.telefono}?text=${encodeURIComponent(data.texto_whatsapp)}`, '_blank');
                }
                cargarPedidos();
            } else {
                alert("Error al confirmar el pedido.");
            }
        }

        async function guardarCostoEnvio(id) {
            const costo = document.getElementById(`costo-envio-${id}`).value;
            if (costo === '') {
                alert('Ingresá el costo de envío correspondiente a la zona.');
                return;
            }
            const res = await fetch('/api/admin/asignar_costo_envio', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, costo_envio: costo })
            });
            const data = await res.json();
            if (!res.ok) {
                alert(data.mensaje || 'No se pudo guardar el costo de envío.');
                return;
            }
            cargarPedidos();
            if (data.telefono) {
                window.open(`https://wa.me/${data.telefono}?text=${encodeURIComponent(data.texto_whatsapp)}`, '_blank');
            }
        }

        async function rechazarPedido(id) {
            const motivo = prompt("Escribe la razón del rechazo / cancelación:");
            if (motivo === null) return;
            if (!motivo.trim()) {
                alert("Debes indicar el motivo del rechazo.");
                return;
            }

            const res = await fetch('/api/admin/rechazar_pedido', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, motivo })
            });

            const data = await res.json();

            if (res.ok) {
                alert("Pedido Rechazado.");
                if (data.telefono) {
                    window.open(`https://wa.me/${data.telefono}?text=${encodeURIComponent(data.texto_whatsapp)}`, '_blank');
                }
                cargarPedidos();
            } else {
                alert(data.mensaje || "Error al rechazar el pedido.");
            }
        }

        async function finalizarPedido(id) {
            const res = await fetch('/api/admin/finalizar_pedido', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });

            const data = await res.json();

            if (res.ok) {
                alert("Pedido Finalizado.");
                if (data.telefono) {
                    window.open(`https://wa.me/${data.telefono}?text=${encodeURIComponent(data.texto_whatsapp)}`, '_blank');
                }
                cargarPedidos();
            } else {
                alert("Error al finalizar el pedido.");
            }
        }

        async function cargarAdmin() {
            try {
                const res = await fetch('/api/admin/bebidas');
                const productos = await res.json();
                const tbody = document.getElementById('admin-productos-body');
                tbody.innerHTML = '';

                productos.forEach(p => {
                    const tr = document.createElement('tr');
                    const urlImagen = /^https?:\/\//i.test(p.imagen || '') ? p.imagen : '';
                    
                    tr.innerHTML = `
                        <td class="imagen-producto-cell">
                            <img src="${escaparHtml(rutaImagen(p.imagen))}" onerror="this.onerror=null;this.src='/static/images/producto-sin-imagen.svg'" width="50" height="50" alt="${escaparHtml(p.nombre)}" style="object-fit: contain; border-radius: 4px; display: block; margin-bottom: 6px;">
                            <input type="url" id="imagen-url-${p.id}" value="${escaparHtml(urlImagen)}" placeholder="URL de imagen" aria-label="URL de imagen para ${escaparHtml(p.nombre)}">
                            <input type="file" id="imagen-archivo-${p.id}" accept="image/*" aria-label="Subir imagen para ${escaparHtml(p.nombre)}">
                            <button class="btn-guardar" type="button" onclick="actualizarImagen(${p.id})">Cambiar imagen</button>
                        </td>
                        <td><strong>${escaparHtml(p.nombre)}</strong></td>
                        <td><input type="number" min="0" id="precio-${p.id}" value="${p.precio}" step="0.01" oninput="actualizarPrecioFinal(${p.id})"></td>
                        <td><input type="number" min="0" max="99.99" id="descuento-${p.id}" value="${p.descuento_pct}" step="0.01" oninput="actualizarPrecioFinal(${p.id})"></td>
                        <td><input type="number" id="precio-final-${p.id}" value="${Number(p.precio_final).toFixed(2)}" readonly></td>
                        <td><input type="number" min="0" step="1" id="stock-${p.id}" value="${p.stock}"></td>
                        <td style="display: flex; gap: 6px;">
                            <button class="btn-guardar" onclick="guardarCambios(${p.id})">Guardar</button>
                            <button class="btn-guardar" onclick="eliminarProducto(${p.id})" style="background-color: #c0392b;">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error al cargar productos:", err);
            }
        }

        async function agregarNuevaBebida(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('nombre', document.getElementById('nuevo-nombre').value);
            formData.append('precio', document.getElementById('nuevo-precio').value);
            formData.append('descuento_pct', document.getElementById('nuevo-descuento').value);
            formData.append('stock', document.getElementById('nuevo-stock').value);
            formData.append('imagen_url', document.getElementById('nuevo-imagen-url').value);
            
            const fileInput = document.getElementById('nuevo-imagen');
            if (fileInput.files[0]) {
                formData.append('imagen', fileInput.files[0]);
            }

            const res = await fetch('/api/admin/agregar_producto', {
                method: 'POST',
                body: formData
            });

            if (res.ok) {
                alert("Bebida agregada con éxito");
                document.getElementById('form-nueva-bebida').reset();
                actualizarPrecioNuevo();
                cargarAdmin();
            } else {
                const data = await res.json();
                alert(data.mensaje || "Error al agregar la bebida");
            }
        }

        async function guardarCambios(id) {
            const precio = document.getElementById(`precio-${id}`).value;
            const descuento_pct = document.getElementById(`descuento-${id}`).value;
            const stock = document.getElementById(`stock-${id}`).value;

            const res = await fetch('/api/admin/actualizar_producto', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, precio, descuento_pct, stock })
            });

            if (res.ok) {
                alert("Producto actualizado correctamente");
                cargarAdmin();
            } else {
                const data = await res.json();
                alert(data.mensaje || "Error al actualizar");
            }
        }

        async function actualizarImagen(id) {
            const formData = new FormData();
            formData.append('id', id);
            formData.append('imagen_url', document.getElementById(`imagen-url-${id}`).value);
            const archivo = document.getElementById(`imagen-archivo-${id}`).files[0];
            if (archivo) formData.append('imagen', archivo);

            const res = await fetch('/api/admin/actualizar_imagen', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (res.ok) {
                cargarAdmin();
            } else {
                alert(data.mensaje || 'No se pudo actualizar la imagen.');
            }
        }

        async function sincronizarCatalogoCsv() {
            if (!confirm('Esta acción reemplaza el catálogo actual con todas las filas de productos_7soles.csv. ¿Continuar?')) return;
            const res = await fetch('/api/admin/sincronizar_csv', { method: 'POST' });
            const data = await res.json();
            if (res.ok) {
                alert(`${data.mensaje}: ${data.cantidad} productos.`);
                cargarAdmin();
            } else {
                alert(data.mensaje || 'No se pudo importar el CSV.');
            }
        }

        async function eliminarProducto(id) {
            if (!confirm('¿Eliminar este producto del catálogo?')) return;

            const res = await fetch('/api/admin/eliminar_producto', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            const data = await res.json();

            if (res.ok) {
                cargarAdmin();
            } else {
                alert(data.mensaje || 'Error al eliminar el producto.');
            }
        }

        async function cambiarEstadoDelivery(estado) {
            const toggle = document.getElementById('delivery-toggle');
            const indicador = document.getElementById('delivery-estado');
            toggle.disabled = true;
            try {
                const res = await fetch('/api/admin/toggle_delivery', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ disponible: estado })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje || 'No se pudo guardar el estado de Delivery.');
                toggle.checked = data.delivery_disponible;
                indicador.textContent = data.delivery_disponible ? 'Habilitado' : 'Deshabilitado';
            } catch (error) {
                toggle.checked = !estado;
                indicador.textContent = toggle.checked ? 'Habilitado' : 'Deshabilitado';
                alert(error.message);
            } finally {
                toggle.disabled = false;
            }
        }

        // Carga inicial
        actualizarPrecioNuevo();
        cargarAdmin();
        cargarPedidos();

        // Recarga automática cada 5 segundos para recibir pedidos en tiempo real
        setInterval(cargarPedidos, 5000);
    </script>
</body>
</html>
