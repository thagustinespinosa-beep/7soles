<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de administrador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-bg">
    <main class="container" style="max-width: 460px; padding-top: 60px;">
        <section class="card admin-card">
            <h1>Ingreso de administrador</h1>
            {% if error %}<p role="alert" style="color: #c0392b;">{{ error }}</p>{% endif %}
            <form method="post" class="form-grid">
                <div>
                    <label for="username">Nombre de usuario</label>
                    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
                </div>
                <div>
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-guardar">Ingresar</button>
            </form>
            <a href="/">Volver a la tienda</a>
        </section>
    </main>
</body>
</html>
